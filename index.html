<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coloratorfly - Generador de paleta de colores</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Coloratorfly</h1>
  </header>

  <section id="wrapper-configuracion" aria-label="Controles de configuración">
    <form>
      <ul>
        <div>
          <li>
            <label for="select-cantidad-paleta">Cantidad:</label>
            <select name="cantidad-paleta" id="select-cantidad-paleta">
              <option value="6">6</option>
              <option value="8">8</option>
              <option value="9">9</option>
            </select>
          </li>
          <li>
            <label for="select-formato-color">Formato:</label>
            <select name="formato-color" id="select-formato-color">
              <option value="hsl">hsl</option>
              <option value="hex">hex</option>
            </select>
          </li>
        </div>
        <li>
          <button type="submit" id="boton-generar">Generar</button>
        </li>
      </ul>
    </form>
  </section>

  <!-- Por defecto habrán 6 divs para la paleta, dependiendo la selección en el select se crearán con JS -->
  <main id="wrapper-paleta-colores">
    <div class="wrapper-color">
      <p class="color__formato"></p>
      <button type="button" class="btn-copiar" aria-label="Copiar color al portapapeles">
        <img src="./assets/img/copy.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="wrapper-color">
      <p class="color__formato"></p>
      <button type="button" class="btn-copiar" aria-label="Copiar color al portapapeles">
        <img src="./assets/img/copy.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="wrapper-color">
      <p class="color__formato"></p>
      <button type="button" class="btn-copiar" aria-label="Copiar color al portapapeles">
        <img src="./assets/img/copy.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="wrapper-color">
      <p class="color__formato"></p>
      <button type="button" class="btn-copiar" aria-label="Copiar color al portapapeles">
        <img src="./assets/img/copy.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="wrapper-color">
      <p class="color__formato"></p>
      <button type="button" class="btn-copiar" aria-label="Copiar color al portapapeles">
        <img src="./assets/img/copy.svg" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="wrapper-color">
      <p class="color__formato"></p>
      <button type="button" class="btn-copiar" aria-label="Copiar color al portapapeles">
        <img src="./assets/img/copy.svg" alt="" aria-hidden="true">
      </button>
    </div>
  </main>
  <script src="./main.js" defer></script>
</body>
</html>
