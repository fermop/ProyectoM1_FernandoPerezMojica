<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./assets/img/logo.webp">
  <title>Colorfly</title>
  <meta name="description" content="Generador de paleta de colores"/>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img id="logo" src="./assets/img/logo.webp" alt="">
    <h1>Colorfly</h1>
  </header>

  <section id="wrapper-configuracion" aria-label="Controles de configuración">
    <form id="formulario-paleta">
      <div class="grupo-selects">
        <div class="control-input">
          <label for="select-cantidad-paleta">Cantidad:</label>
          <select name="cantidad-paleta" id="select-cantidad-paleta" class="cursor-pointer">
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="9">9</option>
          </select>
        </div>
        
        <div class="control-input">
          <label for="select-formato-color">Formato:</label>
          <select name="formato-color" id="select-formato-color" class="cursor-pointer">
            <option value="hsl">hsl</option>
            <option value="hex">hex</option>
          </select>
        </div>
      </div>

      <div class="control-boton">
        <button type="submit" id="boton-generar" class="animacion-click cursor-pointer">Generar</button>
      </div>
    </form>
  </section>

  <!--
    Por defecto habrán 6 divs para la paleta, dependiendo la selección en el select se crearán con JS.

    Se crearán los elementos desde JS para evitar "esconder" elementos y mejorar la accesibilidad para lectores de pantalla, sin necesidad de ocultar los divs para el generador de la paleta de colores.
  -->
  <main id="wrapper-paleta-colores">
    <!-- <div class="wrapper-color">
      <p class="color__formato-texto"></p>
      <button type="button" class="boton-copiar" aria-label="Copiar color al portapapeles">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>
    </div> -->
  </main>

  <!-- Contenedor para las notificaciones Toast -->
  <!--
    aria-live="polite" le dice al lector de pantalla que lea el contenido nuevo cuando termine de hablar, sin interrumpir al usuario.
    aria-atomic="true" asegura que lea todo el mensaje completo.
  -->
  <div id="toast-contenedor" aria-live="polite" aria-atomic="true"></div>
  <script src="./main.js" defer></script>
</body>
</html>
